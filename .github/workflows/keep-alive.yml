name: Keep SocioSquad Alive

# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's public anon/publishable key

on:
  schedule:
    # Runs at 00:00 every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Opportunities Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # Fetch just 1 row from the public opportunities table
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/opportunities?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
